<!DOCTYPE html>
<html>
<head>
  <title>BusBot - Maya</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background: #f5f5f5; }
    h2 { color: #d32f2f; }
    #chat { background: white; border-radius: 10px; padding: 20px; height: 400px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 12px; max-width: 80%; }
    .user { background: #d32f2f; color: white; margin-left: auto; text-align: right; }
    .maya { background: #eee; color: #333; }
    #inputRow { display: flex; margin-top: 10px; gap: 8px; }
    #nameInput, #msgInput { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px 20px; background: #d32f2f; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>RedBus - Chat with Maya</h2>
  <input id="nameInput" placeholder="Your name (e.g. ashrith)" />
  <div id="chat"></div>
  <div id="inputRow">
    <input id="msgInput" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const nameInput = document.getElementById("nameInput");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const name = nameInput.value.trim();
      const message = msgInput.value.trim();
      if (!name || !message) {
        alert("Please enter both your name and a message.");
        return;
      }
      addMessage(message, "user");
      msgInput.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ customer_name: name, message: message })
      });
      const data = await res.json();
      addMessage(data.reply, "maya");
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
